/* Added-list workflow: single-click picker, persistent enable/disable state. */
.new-button {
  display:inline-flex; align-items:center; justify-content:center; gap:4px;
  padding:6px 10px; border:1px solid #b1d9a3; border-radius:6px;
  background:#b4d9a6; color:#233821; font-size:11px; font-weight:650;
}
.new-button:hover { background:#c8e8b9; border-color:#d9efcb; }
.new-button svg { width:13px; height:13px; }
.list-heading { min-height:31px; }
#entry-total { color:#93a691; font:10px Consolas,monospace; }
.entry-actions { display:flex; align-items:center; gap:1px; flex:none; }
.operator-row .row-select { cursor:default; }
.row-action {
  display:grid; place-items:center; width:25px; height:31px; padding:0;
  background:transparent; border:0; border-radius:5px; color:#819b87;
}
.row-action svg { width:14px; height:14px; }
.row-action:hover { color:#d1e8c5; background:#3a4e3b; }
.row-power[aria-pressed=true] { color:#b9deb5; }
.row-remove:hover { color:#f0baa5; background:#553d31; }
.operator-row.is-disabled { background:#1c2520; }
.operator-row.is-disabled::before { background:#6d8276; }
.operator-row.is-disabled .operator-avatar { filter:grayscale(1); opacity:.65; }
.operator-row.is-disabled .operator-name strong { color:#9dad9f; text-decoration:line-through; }
.operator-row.is-disabled .operator-bonds { color:#8d9d92; }
.disabled-badge {
  flex:none; white-space:nowrap; font-size:8px; padding:1px 3px;
  color:#aebbb0; border:1px solid #526356; background:#2c392f; border-radius:3px;
}
.chip.disabled { color:#a2b0a4; background:#263329; border-color:#526050; text-decoration:line-through; }
.picker-backdrop {
  position:absolute; inset:0; z-index:10; display:grid; place-items:center;
  padding:16px; background:#081008c9; backdrop-filter:blur(4px);
}
.picker {
  display:flex; flex-direction:column; width:100%; height:min(660px,100%); min-height:0;
  overflow:hidden; border:1px solid #5b7450; border-radius:13px;
  background:#1a271e; box-shadow:0 18px 45px #0008;
}
.picker-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:18px 15px 13px; }
.picker-head h2 { font-size:15px; font-weight:620; margin:0 0 7px; color:#e2edd8; }
.picker-head p { font-size:10px; line-height:1.6; color:#a2b69b; margin:0; }
.picker-filters { display:flex; flex-direction:column; gap:8px; padding:0 14px 12px; flex:none; }
.picker-filters .bond-filter { flex:none; width:100%; }
.picker-meta { display:flex; justify-content:space-between; gap:8px; padding:0 15px 10px; color:#9bb492; font-size:9px; flex:none; }
.picker-meta b { color:#d4e7c4; font:10px Consolas,monospace; }
.picker-list {
  flex:1; min-height:65px; overflow-y:auto; overscroll-behavior:contain;
  margin:0 12px; border:1px solid #3a5036; border-radius:7px; background:#142019;
  scrollbar-width:thin; scrollbar-color:#526b47 #142019;
}
.picker-row { border-bottom:1px solid #30432c; }
.picker-row:last-child { border-bottom:0; }
.picker-add {
  display:flex; align-items:center; gap:9px; width:100%; min-height:58px;
  text-align:left; border:0; padding:10px; color:#dce9d4; background:transparent;
}
.picker-add:not(:disabled):hover { background:#2d442b; }
.picker-add:disabled { opacity:1; cursor:default; background:#203624; }
.picker-add:disabled .operator-avatar { opacity:.6; }
.picker-add:focus-visible { outline-offset:-3px; }
.picker-add-label { display:flex; align-items:center; gap:3px; flex:none; color:#b6d7a5; font-size:9px; white-space:nowrap; }
.picker-add-label svg { width:12px; height:12px; }
.picker-add:disabled .picker-add-label { color:#a2c29a; }
.picker-footer { padding:10px 14px 13px; flex:none; }
.picker-footer p { color:#b8caa8; font-size:9px; line-height:1.7; margin:0; min-height:30px; }
.picker-footer .settings-done { margin-top:7px; padding:9px; }
@media(max-height:650px) {
  .picker-head { padding-top:13px; padding-bottom:10px; }
  .picker-add { min-height:51px; padding-top:7px; padding-bottom:7px; }

.workflow .hotkey-error{flex-basis:100%;margin:0;padding:6px 8px;border:1px solid #7a4b3a;border-radius:6px;background:#3a241d;color:#f3c1a8;font-size:10px;line-height:1.5}
.workflow .hotkey-chip{margin-left:auto;padding:1px 6px;border:1px solid #53674d;border-bottom-width:2px;border-radius:5px;color:#a7b99e;font:600 9px Consolas,monospace}

/* ==========================================================================
   卫戍协议拿牌器 · 视觉 v3（2026-10-15）
   Loaded after ui.css + workflow.css. Pure presentation layer: remove this file
   (and its <link>/build line) to fall back to the previous look.
   All selectors are anchored on `.workbench.workflow` so they win over the
   older layers without !important.
   ========================================================================== */
.workbench.workflow{
  --v-bg:#0b0f14; --v-surface:#10151c; --v-raised:#151b24; --v-raised-2:#1b2330; --v-sunken:#0c1117;
  --v-line:rgba(148,163,184,.12); --v-line-2:rgba(148,163,184,.2); --v-line-3:rgba(148,163,184,.32);
  --v-text:#e7edf4; --v-sub:#a3afbd; --v-faint:#6d7a8a;
  --v-accent:#34d399; --v-accent-2:#22d3ee; --v-accent-ink:#04140d;
  --v-keep:#f5b942; --v-keep-2:#fb923c; --v-keep-ink:#1a1003;
  --v-danger:#f87171; --v-warn:#fbbf24;
  --v-list:var(--v-accent); --v-list-2:var(--v-accent-2); --v-list-ink:var(--v-accent-ink);
  --v-radius:12px; --v-radius-sm:8px;
  --v-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.28);
  --t1:#9aa8b8; --t2:#4ade80; --t3:#60a5fa; --t4:#c084fc; --t5:#fbbf24; --t6:#fb7185;
  --v-font:"Inter","Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-family:var(--v-font);
  font-variant-numeric:tabular-nums;
  color:var(--v-text);
  background:
    radial-gradient(120% 60% at 0% 0%,rgba(52,211,153,.08),transparent 55%),
    radial-gradient(90% 50% at 100% 100%,rgba(34,211,238,.05),transparent 60%),
    var(--v-surface);
  border-right:1px solid var(--v-line-2);
  box-shadow:18px 0 60px rgba(0,0,0,.45);
}
.workbench.workflow[data-active=keep]{--v-list:var(--v-keep);--v-list-2:var(--v-keep-2);--v-list-ink:var(--v-keep-ink)}
.workbench.workflow ::selection{background:rgba(52,211,153,.3)}
.workbench.workflow *{scrollbar-width:thin;scrollbar-color:rgba(148,163,184,.28) transparent}
.workbench.workflow button:focus-visible,.workbench.workflow input:focus-visible,.workbench.workflow select:focus-visible{outline:2px solid var(--v-list);outline-offset:2px}
.workbench.workflow input[type=number]{-moz-appearance:textfield;appearance:textfield}
.workbench.workflow input[type=number]::-webkit-inner-spin-button,.workbench.workflow input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* ---- Header ---------------------------------------------------------- */
.workbench.workflow .top-accent{height:2px;background:linear-gradient(90deg,var(--v-accent),var(--v-accent-2) 45%,transparent)}
.workbench.workflow .brand{height:60px;padding:10px 14px 10px 16px;gap:11px;border-bottom:0}
.workbench.workflow .brand-avatar{width:34px;height:34px;border-radius:10px;border:0;box-shadow:0 0 0 1px var(--v-line-2),0 4px 14px rgba(52,211,153,.18)}
.workbench.workflow .brand-text strong{font-size:16px;font-weight:700;letter-spacing:.02em;color:var(--v-text)}
.workbench.workflow .brand-text small{font-size:10px;letter-spacing:.04em;margin-top:2px;color:var(--v-faint)}
.workbench.workflow .header-controls{gap:2px}
.workbench.workflow .icon-button{width:30px;height:30px;border-radius:8px;color:var(--v-sub);border:1px solid transparent}
.workbench.workflow .icon-button svg{width:16px;height:16px}
.workbench.workflow .icon-button:hover{background:var(--v-raised-2);border-color:var(--v-line-2);color:var(--v-text)}
.workbench.workflow .context{min-height:30px;margin:0 14px;padding:0 10px;border:1px solid var(--v-line);border-radius:var(--v-radius-sm);background:var(--v-sunken);color:var(--v-sub);font-size:10px}
.workbench.workflow .context-label svg{color:var(--v-faint)}
.workbench.workflow .phase-pill{border:0;border-radius:999px;padding:3px 8px;background:rgba(52,211,153,.1);color:var(--v-accent);font-size:9px;letter-spacing:.02em}

/* ---- Main column ----------------------------------------------------- */
.workbench.workflow .main{padding:12px 14px 0;gap:10px}
.workbench.workflow .tabs{position:relative;min-height:46px;padding:4px;gap:4px;border:1px solid var(--v-line);border-radius:var(--v-radius);background:var(--v-sunken)}
.workbench.workflow .tab{min-height:36px;border-radius:9px;font-size:13px;font-weight:600;color:var(--v-sub);gap:7px;transition:color .15s,background .15s,box-shadow .15s}
.workbench.workflow .tab:hover{color:var(--v-text);background:rgba(148,163,184,.06)}
.workbench.workflow .tab svg{width:15px;height:15px}
.workbench.workflow .tab[aria-selected=true]{color:var(--v-text);background:var(--v-raised-2);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 0 0 1px var(--v-line-2),0 6px 16px rgba(0,0,0,.3)}
.workbench.workflow .tab[aria-selected=true] svg{color:var(--v-list)}
.workbench.workflow .tab-counter{min-width:22px;padding:2px 6px;border-radius:999px;font:600 10px/1.3 var(--v-font);background:rgba(148,163,184,.12);color:var(--v-sub)}
.workbench.workflow .tab[aria-selected=true] .tab-counter{background:var(--v-list);color:var(--v-list-ink)}

.workbench.workflow .plan-toolbar{gap:8px}
.workbench.workflow .new-button{border:0;color:var(--v-list-ink);background:linear-gradient(135deg,var(--v-list),var(--v-list-2));box-shadow:0 6px 18px color-mix(in srgb,var(--v-list) 28%,transparent);font-weight:700;transition:filter .15s,transform .15s}
.workbench.workflow .new-button:hover{filter:brightness(1.08);background:linear-gradient(135deg,var(--v-list),var(--v-list-2))}
.workbench.workflow .new-button:active{transform:translateY(1px)}
.workbench.workflow .new-button svg{width:15px;height:15px}
.workbench.workflow .primary-add{min-height:40px;border-radius:10px;font-size:13px;gap:6px}
.workbench.workflow .tool-button{min-height:40px;padding:0 12px;border:1px solid var(--v-line-2);border-radius:10px;background:var(--v-raised);color:var(--v-sub);font-size:12px;transition:background .15s,color .15s,border-color .15s}
.workbench.workflow .tool-button:hover{background:var(--v-raised-2);color:var(--v-text);border-color:var(--v-line-3)}
.workbench.workflow .tool-button[aria-expanded=true]{border-color:var(--v-list);color:var(--v-text);background:color-mix(in srgb,var(--v-list) 10%,var(--v-raised))}
.workbench.workflow .plan-toolbar>[data-action=bulk-more]{width:40px;font-size:18px;letter-spacing:1px}
.workbench.workflow .tool-button #filter-count{background:var(--v-list);color:var(--v-list-ink);border-radius:999px;min-width:16px;padding:1px 4px;font-size:9px}

.workbench.workflow .search{min-height:40px;height:40px;border-radius:10px;border:1px solid var(--v-line);background:var(--v-sunken);color:var(--v-faint);padding:0 12px;transition:border-color .15s,box-shadow .15s}
.workbench.workflow .search:focus-within{border-color:color-mix(in srgb,var(--v-list) 60%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--v-list) 14%,transparent)}
.workbench.workflow .search input{color:var(--v-text);font-size:12px}
.workbench.workflow .search input::placeholder{color:var(--v-faint)}
.workbench.workflow .search kbd{border:1px solid var(--v-line-2);border-radius:5px;padding:1px 5px;font:10px var(--v-font);color:var(--v-faint);background:var(--v-raised)}
.workbench.workflow .search-clear{color:var(--v-faint)}
.workbench.workflow .search-clear:hover{color:var(--v-text)}
.workbench.workflow .advanced-filter{padding:10px;gap:9px;border:1px solid var(--v-line);border-radius:var(--v-radius);background:var(--v-raised)}
.workbench.workflow .bond-filter{height:34px;border:1px solid var(--v-line);border-radius:8px;background:var(--v-sunken);color:var(--v-faint)}
.workbench.workflow .bond-filter select{color:var(--v-text);font-size:11px}
.workbench.workflow .bond-filter option,.workbench.workflow .bond-filter optgroup{background:var(--v-raised-2);color:var(--v-text)}
.workbench.workflow .selected-only{border:1px solid var(--v-line-2);border-radius:8px;background:var(--v-sunken);color:var(--v-sub)}
.workbench.workflow .selected-only[aria-pressed=true]{border-color:var(--v-list);color:var(--v-text);background:color-mix(in srgb,var(--v-list) 14%,var(--v-sunken))}
.workbench.workflow .tiers{gap:4px;padding:3px;border-radius:9px;background:var(--v-sunken);border:1px solid var(--v-line)}
.workbench.workflow .tier-button{border:0;border-radius:6px;color:var(--v-sub);font-size:11px;padding:5px 0}
.workbench.workflow .tier-button:hover{background:rgba(148,163,184,.08);color:var(--v-text)}
.workbench.workflow .tier-button[aria-pressed=true]{background:var(--v-raised-2);color:var(--v-text);box-shadow:0 0 0 1px var(--v-line-2)}
.workbench.workflow .tier-button[data-tier-filter="1"][aria-pressed=true],.workbench.workflow .tier-button[data-picker-tier="1"][aria-pressed=true]{color:var(--t1)}
.workbench.workflow .tier-button[data-tier-filter="2"][aria-pressed=true],.workbench.workflow .tier-button[data-picker-tier="2"][aria-pressed=true]{color:var(--t2)}
.workbench.workflow .tier-button[data-tier-filter="3"][aria-pressed=true],.workbench.workflow .tier-button[data-picker-tier="3"][aria-pressed=true]{color:var(--t3)}
.workbench.workflow .tier-button[data-tier-filter="4"][aria-pressed=true],.workbench.workflow .tier-button[data-picker-tier="4"][aria-pressed=true]{color:var(--t4)}
.workbench.workflow .tier-button[data-tier-filter="5"][aria-pressed=true],.workbench.workflow .tier-button[data-picker-tier="5"][aria-pressed=true]{color:var(--t5)}
.workbench.workflow .tier-button[data-tier-filter="6"][aria-pressed=true],.workbench.workflow .tier-button[data-picker-tier="6"][aria-pressed=true]{color:var(--t6)}
.workbench.workflow .text-button{color:var(--v-sub)}
.workbench.workflow .text-button:hover{color:var(--v-list)}

.workbench.workflow .list-heading{min-height:18px;padding:0 2px;font-size:11px;color:var(--v-sub)}
.workbench.workflow .list-heading b{color:var(--v-text);font-weight:700}
.workbench.workflow #enabled-summary{font-size:10px;color:var(--v-faint)}

/* ---- Roster: rows become separate cards ------------------------------ */
.workbench.workflow .operator-list{border:0;border-radius:0;background:transparent;padding:0 2px 8px;margin:0 -2px;display:block}
.workbench.workflow #operator-rows{display:flex;flex-direction:column;gap:6px}
.workbench.workflow .operator-row{--tier:var(--t1);min-height:54px;padding:0 6px 0 0;gap:4px;border:1px solid var(--v-line);border-radius:var(--v-radius);background:var(--v-raised);box-shadow:var(--v-shadow);transition:border-color .15s,background .15s,transform .15s}
.workbench.workflow .operator-row[data-tier="2"]{--tier:var(--t2)}
.workbench.workflow .operator-row[data-tier="3"]{--tier:var(--t3)}
.workbench.workflow .operator-row[data-tier="4"]{--tier:var(--t4)}
.workbench.workflow .operator-row[data-tier="5"]{--tier:var(--t5)}
.workbench.workflow .operator-row[data-tier="6"]{--tier:var(--t6)}
.workbench.workflow .operator-row:last-child{border-bottom:1px solid var(--v-line)}
.workbench.workflow .operator-row:hover{border-color:var(--v-line-3);background:var(--v-raised-2)}
.workbench.workflow .operator-row.is-selected{background:var(--v-raised)}
.workbench.workflow .operator-row.is-selected:hover{background:var(--v-raised-2)}
.workbench.workflow .operator-row.is-selected::before,.workbench.workflow .operator-row::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--tier);opacity:.9}
.workbench.workflow .operator-row.is-locked::before{background:var(--tier)}
.workbench.workflow .row-select{padding:8px 6px 8px 12px;gap:10px}
.workbench.workflow .operator-avatar{width:34px;height:34px;border-radius:10px;font-size:15px;font-weight:700;color:var(--tier);border:1px solid color-mix(in srgb,var(--tier) 38%,transparent);background:linear-gradient(150deg,color-mix(in srgb,var(--tier) 22%,transparent),color-mix(in srgb,var(--tier) 6%,transparent))}
.workbench.workflow .operator-name{gap:6px}
.workbench.workflow .operator-name strong{font-size:13px;font-weight:650;color:var(--v-text)}
.workbench.workflow .operator-bonds{font-size:10.5px;color:var(--v-faint);margin-top:1px}
.workbench.workflow .rank{padding:1px 5px;border-radius:999px;font:700 9px/1.4 var(--v-font);letter-spacing:.02em;color:var(--tier);background:color-mix(in srgb,var(--tier) 14%,transparent)}
.workbench.workflow .special-badge,.workbench.workflow .manual-badge{padding:1px 5px;border-radius:999px;border:0;font-size:9px;line-height:1.4}
.workbench.workflow .special-badge{color:var(--v-warn);background:rgba(251,191,36,.12)}
.workbench.workflow .manual-badge{color:#93c5fd;background:rgba(96,165,250,.14)}
.workbench.workflow .entry-actions{gap:2px}
/* 启用 / 已禁用 / 已满 as a status pill with a dot */
.workbench.workflow .row-power{position:relative;min-width:56px;height:28px;min-height:28px;padding:0 9px 0 20px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid color-mix(in srgb,var(--v-accent) 40%,transparent);color:var(--v-accent);background:rgba(52,211,153,.1);transition:background .15s,border-color .15s,color .15s}
.workbench.workflow .row-power::before{content:"";position:absolute;left:9px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.workbench.workflow .row-power:hover{background:rgba(52,211,153,.18)}
.workbench.workflow .is-disabled .row-power,.workbench.workflow .row-power[aria-pressed=false]{color:var(--v-faint);border-color:var(--v-line-2);background:transparent}
.workbench.workflow .is-disabled .row-power::before,.workbench.workflow .row-power[aria-pressed=false]::before{box-shadow:none}
.workbench.workflow .is-disabled .row-power:hover,.workbench.workflow .row-power[aria-pressed=false]:hover{color:var(--v-text);border-color:var(--v-line-3)}
.workbench.workflow .row-lock{width:28px;height:28px;border-radius:8px;color:var(--v-faint)}
.workbench.workflow .row-lock:hover{background:var(--v-raised-2);color:var(--v-text)}
.workbench.workflow .row-lock[aria-pressed=true]{color:var(--v-warn);background:rgba(251,191,36,.1)}
.workbench.workflow .row-more{width:26px;height:28px;border-radius:8px;color:var(--v-faint);font-size:16px}
.workbench.workflow .row-more:hover{background:var(--v-raised-2);color:var(--v-text);border-radius:8px}
.workbench.workflow .operator-row.is-disabled{background:var(--v-surface);border-style:dashed;box-shadow:none}
.workbench.workflow .operator-row.is-disabled::before{background:var(--v-faint);opacity:.5}
.workbench.workflow .operator-row.is-disabled .operator-avatar{filter:grayscale(1);opacity:.5}
.workbench.workflow .operator-row.is-disabled .operator-name strong{color:var(--v-faint);text-decoration:line-through;text-decoration-color:rgba(148,163,184,.5)}
.workbench.workflow .operator-row.is-disabled .operator-bonds{color:var(--v-faint);opacity:.75}
.workbench.workflow.compact .operator-row{min-height:44px}
.workbench.workflow.compact .operator-avatar{width:28px;height:28px;font-size:13px;border-radius:8px}
.workbench.workflow.compact .row-select{padding-top:5px;padding-bottom:5px}
.workbench.workflow .empty{color:var(--v-faint);border:1px dashed var(--v-line-2);border-radius:var(--v-radius);background:rgba(148,163,184,.03);min-height:220px}
.workbench.workflow .empty svg{color:var(--v-list);width:28px;height:28px}
.workbench.workflow .empty strong{color:var(--v-text);font-weight:650}
.workbench.workflow .empty .new-button{padding:8px 14px;border-radius:10px}

/* Rule drawer attached under a row (保留干员 + 道具) */
.workbench.workflow .operator-row:has(+ .keep-rules){border-radius:var(--v-radius) var(--v-radius) 0 0;border-bottom-color:transparent;box-shadow:none}
.workbench.workflow .keep-rules{margin:-6px 0 0;padding:8px 10px 9px 12px;gap:6px 10px;border:1px solid var(--v-line);border-top:1px dashed var(--v-line);border-radius:0 0 var(--v-radius) var(--v-radius);background:var(--v-sunken);box-shadow:var(--v-shadow);font-size:11px}
.workbench.workflow .operator-row.is-disabled + .keep-rules{border-style:dashed;box-shadow:none;opacity:.8}
.workbench.workflow .item-limit-label,.workbench.workflow .item-funds-label{gap:5px;color:var(--v-sub);font-size:11px}
.workbench.workflow .item-limit-label input,.workbench.workflow .item-funds-label input{height:26px;padding:0 6px;border:1px solid var(--v-line-2);border-radius:7px;background:var(--v-raised);color:var(--v-text);font:600 11px var(--v-font);text-align:center}
.workbench.workflow .item-limit-label input{width:44px}
.workbench.workflow .item-funds-label input{width:68px}
.workbench.workflow .item-limit-label input:focus,.workbench.workflow .item-funds-label input:focus{border-color:var(--v-list);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--v-list) 16%,transparent)}
.workbench.workflow .item-limit-label input::placeholder,.workbench.workflow .item-funds-label input::placeholder{color:var(--v-faint);font-weight:400}
.workbench.workflow .item-stepper{gap:0;height:26px;margin-left:0;border:1px solid var(--v-line-2);border-radius:999px;background:var(--v-raised);color:var(--v-text);font-size:11px;overflow:hidden}
.workbench.workflow .item-stepper span{padding:0 8px;font-weight:600}
.workbench.workflow .item-stepper button{width:26px;height:24px;border:0;border-radius:0;background:transparent;color:var(--v-sub);font-size:14px}
.workbench.workflow .item-stepper button:hover:not(:disabled){background:var(--v-raised-2);color:var(--v-list)}
.workbench.workflow .item-stepper button:disabled{opacity:.3}
/* 自动使用: a real switch look built on the checkbox */
.workbench.workflow .item-use-label{gap:7px;height:26px;padding:0 10px 0 6px;border:1px solid var(--v-line-2);border-radius:999px;background:var(--v-raised);color:var(--v-sub);font-size:11px;transition:border-color .15s,background .15s,color .15s}
.workbench.workflow .item-use-label input{appearance:none;-webkit-appearance:none;position:relative;width:26px;height:15px;margin:0;border-radius:999px;background:rgba(148,163,184,.25);cursor:pointer;transition:background .15s}
.workbench.workflow .item-use-label input::after{content:"";position:absolute;left:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#d6dde6;transition:transform .15s}
.workbench.workflow .item-use-label input:checked{background:var(--v-accent)}
.workbench.workflow .item-use-label input:checked::after{transform:translateX(11px);background:var(--v-accent-ink)}
.workbench.workflow .item-use-label.is-on{color:var(--v-text);border-color:color-mix(in srgb,var(--v-accent) 45%,transparent);background:rgba(52,211,153,.08)}
.workbench.workflow .item-use-note{display:flex;gap:6px;align-items:flex-start;padding:6px 8px;border-radius:8px;background:rgba(251,191,36,.08);color:#fcd34d;font-size:10.5px;line-height:1.45}

/* ---- 道具规则 section -------------------------------------------------- */
.workbench.workflow .item-section{margin:0 0 10px;border:1px solid var(--v-line);border-radius:var(--v-radius);background:linear-gradient(180deg,rgba(245,185,66,.06),transparent 120px),var(--v-raised);box-shadow:var(--v-shadow);overflow:hidden}
.workbench.workflow .item-section>summary{min-height:42px;padding:10px 12px;gap:8px;color:var(--v-text);font-size:12px}
.workbench.workflow .item-section>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--v-sub);border-bottom:2px solid var(--v-sub);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.workbench.workflow .item-section:not([open])>summary::before{content:"";transform:rotate(-45deg)}
.workbench.workflow .item-section>summary strong{font-size:13px;font-weight:650}
.workbench.workflow .item-section>summary span{padding:1px 7px;border-radius:999px;background:rgba(245,185,66,.14);color:var(--v-keep);font:600 10px/1.5 var(--v-font)}
.workbench.workflow .item-section>summary small{color:var(--v-faint);font-size:10px}
.workbench.workflow .item-content{gap:8px;padding:0 10px 12px}
.workbench.workflow .item-help{border:1px solid var(--v-line);border-radius:9px;background:var(--v-sunken)}
.workbench.workflow .item-help>summary{display:flex;align-items:center;gap:6px;padding:7px 10px;color:var(--v-sub);font-size:11px;cursor:pointer;list-style:none}
.workbench.workflow .item-help>summary::-webkit-details-marker{display:none}
.workbench.workflow .item-help>summary::before{content:"i";display:grid;place-items:center;width:15px;height:15px;border-radius:50%;background:rgba(148,163,184,.16);color:var(--v-text);font:700 10px/1 Georgia,serif}
.workbench.workflow .item-help>summary::after{content:"展开";margin-left:auto;color:var(--v-faint);font-size:10px}

/* 名单页：行更紧凑，同屏多显示几条 */
.workbench.workflow .row-select{min-height:50px;padding-top:6px;padding-bottom:6px}
.workbench.workflow .list-heading{display:flex;align-items:center;gap:8px}
.workbench.workflow .list-heading>span:first-child{margin-right:auto}
.workbench.workflow .density-toggle{flex:none;height:20px;padding:0 8px;border:1px solid var(--v-line-2);border-radius:999px;background:transparent;color:var(--v-sub);font-size:10.5px;cursor:pointer}
.workbench.workflow .density-toggle:hover{color:var(--v-text);border-color:var(--v-list)}
.workbench.workflow .density-toggle[aria-pressed=true]{background:color-mix(in srgb,var(--v-list) 18%,transparent);border-color:color-mix(in srgb,var(--v-list) 55%,transparent);color:var(--v-list-2)}
/* 紧凑：说明文字并到名字同一行，行高约 38px */
.workbench.workflow.compact .operator-row{min-height:38px}
.workbench.workflow.compact .row-select{min-height:38px;padding-top:4px;padding-bottom:4px}
.workbench.workflow.compact .operator-text{display:flex;align-items:center;gap:8px;min-width:0}
.workbench.workflow.compact .operator-name{flex:none;max-width:62%;min-width:0}
.workbench.workflow.compact .operator-bonds{flex:1;min-width:0;margin-top:0}
.workbench.workflow.compact .operator-avatar{width:26px;height:26px;font-size:12px}
.workbench.workflow.compact .keep-rules{gap:4px 6px;padding-top:5px;padding-bottom:6px}
.workbench.workflow.compact .item-list{gap:5px}
.workbench.workflow.compact .picker-add{min-height:40px;padding-top:4px;padding-bottom:4px}
/* 矮屏：收起次要提示，把高度让给名单 */
@media(max-height:720px){
  .workbench.workflow .auto-card .auto-risk,.workbench.workflow .main .list-note{display:none!important}
  .workbench.workflow .brand{height:50px;padding-top:6px;padding-bottom:6px}
  .workbench.workflow .brand-avatar{width:32px;height:32px}
  .workbench.workflow .main{gap:6px;padding-top:6px}
  .workbench.workflow .tabs{min-height:40px;padding:3px}
  .workbench.workflow .tab{min-height:32px}
  .workbench.workflow .primary-add,.workbench.workflow .plan-toolbar>.tool-button,.workbench.workflow .plan-toolbar>.icon-button{min-height:36px;height:36px}
  .workbench.workflow .search{min-height:34px;height:34px}
  .workbench.workflow .footer{padding-top:6px;gap:6px}
  .workbench.workflow .auto-card{padding-top:8px;padding-bottom:8px}
  .workbench.workflow .utility-button{min-height:30px;height:30px}
}
/* 配置文件导入 / 导出 */
.workbench.workflow .config-group{display:flex;flex-direction:column;gap:8px}
.workbench.workflow .config-text label{display:block;margin-bottom:3px}
.workbench.workflow .config-text p,.workbench.workflow .config-hint{margin:0;font-size:10.5px;line-height:1.5}
.workbench.workflow .config-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.workbench.workflow .config-actions .tool-button{display:flex;align-items:center;justify-content:center;gap:6px;height:34px;width:100%}
.workbench.workflow .config-actions .tool-button svg{width:14px;height:14px}
.workbench.workflow .config-restore{align-self:flex-start;padding:0;color:var(--v-list);font-size:11px}
/* Keep settings feedback and its close button outside the scrolling content. */
.workbench.workflow .settings{display:flex;flex-direction:column;max-height:calc(100vh - 32px);overflow:hidden}
.workbench.workflow .settings-content{min-height:0;overflow-y:auto;overscroll-behavior:contain;flex:1}
.workbench.workflow .settings-backdrop{padding:16px}

/* 游戏原生头像 / 道具图标。占位字在图片成功解码前保留，失败时不会出现破图。 */
.operator-avatar {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  flex-shrink: 0;
}
.operator-avatar .avatar-fallback {
  line-height: 1;
  pointer-events: none;
}
.operator-avatar .game-icon {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  background: #18241e;
  opacity: 0;
  pointer-events: none;
  transition: opacity .12s ease;
}
.operator-avatar .game-icon.is-loaded { opacity: 1; }
.operator-avatar.has-game-icon .avatar-fallback { visibility: hidden; }
.operator-avatar.item-avatar .game-icon {
  object-fit: contain;
  padding: 3px;
  background: #1b2923;
}
@media (prefers-reduced-motion: reduce) {
  .operator-avatar .game-icon { transition: none; }
}

/* Shared operator/item quick view; compact remains an independent density setting. */
.workbench.workflow .list-view-modes{display:flex;align-items:center;gap:4px;flex:none;margin-left:auto}
.workbench.workflow.icon-only #enabled-summary,.workbench.workflow.icon-only #item-enabled-summary{display:none}
.workbench.workflow.icon-only #operator-rows,.workbench.workflow.icon-only #item-list{--operator-icon-size:44px;display:grid;grid-template-columns:repeat(auto-fill,var(--operator-icon-size));gap:8px;align-content:start;justify-content:start;padding:3px}
.workbench.workflow.icon-only.compact #operator-rows,.workbench.workflow.icon-only.compact #item-list{--operator-icon-size:36px;gap:6px}
.workbench.workflow.icon-only #operator-rows>.empty,.workbench.workflow.icon-only #item-list>.empty,.workbench.workflow.icon-only #item-list>.item-empty{grid-column:1/-1}
.workbench.workflow.icon-only .operator-row.icon-tile{display:grid;place-items:center;position:relative;min-height:var(--operator-icon-size);height:var(--operator-icon-size);width:var(--operator-icon-size);min-width:0;padding:3px;margin:0;gap:0;border:1px solid var(--v-list);border-radius:9px;background:var(--v-surface);box-shadow:none;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-user-drag:none;overflow:hidden}
.workbench.workflow.icon-only .icon-tile::before,.workbench.workflow.icon-only .icon-tile::after{display:none}
.workbench.workflow.icon-only .icon-tile .operator-avatar{width:calc(var(--operator-icon-size) - 8px);height:calc(var(--operator-icon-size) - 8px);border:0;border-radius:6px;box-shadow:none;pointer-events:none}
.workbench.workflow.icon-only .icon-tile.is-disabled{opacity:.8;border-color:var(--v-line-2);background:var(--v-bg)}
.workbench.workflow.icon-only .icon-tile.is-disabled .operator-avatar{filter:grayscale(1);opacity:.5}
.workbench.workflow.icon-only .icon-tile:hover{border-color:var(--v-sub)}
.workbench.workflow.icon-only .icon-tile:focus-visible{outline:2px solid var(--v-list);outline-offset:2px}
.workbench.workflow.icon-only .icon-tile.is-dragging{opacity:.35;cursor:grabbing}
.workbench.workflow.icon-only .icon-tile[data-drop-edge="before"]{box-shadow:inset 3px 0 0 var(--v-list)}
.workbench.workflow.icon-only .icon-tile[data-drop-edge="after"]{box-shadow:inset -3px 0 0 var(--v-list)}
.workbench.workflow.icon-only .icon-tile.is-drag-ghost{z-index:2147483000;opacity:.96;cursor:grabbing;pointer-events:none;filter:drop-shadow(0 12px 18px rgba(0,0,0,.48));}
.workbench.workflow.icon-only .icon-drop-placeholder{width:var(--operator-icon-size,44px);height:var(--operator-icon-size,44px);box-sizing:border-box;border:1px dashed color-mix(in srgb,var(--v-list) 78%,transparent);border-radius:10px;background:color-mix(in srgb,var(--v-list) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--v-list) 10%,transparent);pointer-events:none;}
.workbench.workflow.icon-only #operator-rows>.icon-drop-placeholder,.workbench.workflow.icon-only #item-list>.icon-drop-placeholder{min-height:var(--operator-icon-size,44px);}
.workbench.workflow.icon-only #operator-rows>.icon-tile:not(.is-drag-ghost),.workbench.workflow.icon-only #item-list>.icon-tile:not(.is-drag-ghost){will-change:transform;}
.workbench.workflow.icon-only .icon-tile.is-drag-ghost .game-icon{-webkit-user-drag:none;}
@media(prefers-reduced-motion:reduce){.workbench.workflow.icon-only .icon-tile:not(.is-drag-ghost){scroll-behavior:auto!important;}}
.workbench.workflow.icon-only .item-icon-tile .item-owned-badge{position:absolute;right:0;bottom:0;z-index:1;display:flex;align-items:center;justify-content:center;min-width:15px;height:15px;padding:0 3px;border:1px solid color-mix(in srgb,var(--v-list) 75%,var(--v-line));border-radius:999px;background:var(--v-raised);color:var(--v-text);font:700 9px/1 var(--v-font);font-variant-numeric:tabular-nums;box-shadow:0 1px 4px #0008;pointer-events:none;}
.workbench.workflow.icon-only .item-icon-tile .item-owned-badge[hidden]{display:none!important;}

/* Explicit purchase states: hover and drag must not erase their identity. */
.workbench.workflow.icon-only .icon-tile:not(.is-disabled):not([data-purchase-state="full"]){border-color:#34d399}
.workbench.workflow.icon-only .icon-tile.is-disabled{border-color:#f87171}
.workbench.workflow.icon-only .item-icon-tile[data-purchase-state="enabled"]{border-color:#34d399}
.workbench.workflow.icon-only .item-icon-tile[data-purchase-state="disabled"]{border-color:#f87171}
.workbench.workflow.icon-only .icon-tile[data-purchase-state="full"]{border-color:#fbbf24;opacity:1}
.workbench.workflow.icon-only .icon-tile[data-purchase-state="full"] .operator-avatar{filter:none;opacity:1}
.workbench.workflow .item-row[data-purchase-state="full"] .row-power{color:#fbbf24;border-color:#fbbf24;opacity:1;cursor:default}
.workbench.workflow .item-row[data-purchase-state="disabled"] .row-power{color:#f87171}
.workbench.workflow .item-row[data-purchase-state="enabled"] .row-power{color:#34d399}

.workbench.workflow #keep-item-dock{min-width:0;min-height:0;max-height:none;overflow:visible;border:0;padding:0;margin:0}
.workbench.workflow.icon-only[data-active="keep"] #operator-panel{display:grid;grid-template-columns:minmax(0,1fr);align-content:start;row-gap:8px}
.workbench.workflow.icon-only[data-active="keep"] #operator-panel>#operator-rows,.workbench.workflow.icon-only[data-active="keep"] #operator-panel>#keep-item-dock{min-width:0;grid-column:1/-1}
.workbench.workflow .keep-item-dock-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 3px 7px;color:var(--v-sub);font-size:11px}
.workbench.workflow .keep-item-dock-heading small{font-size:10px;color:var(--v-faint)}
.workbench.workflow.icon-only #keep-item-icons{--operator-icon-size:44px;display:grid;grid-template-columns:repeat(auto-fill,var(--operator-icon-size));gap:8px;align-content:start;padding:3px}
.workbench.workflow.icon-only.compact #keep-item-icons{--operator-icon-size:36px;gap:6px}
.workbench.workflow.icon-only #keep-item-icons .icon-tile{cursor:grab;touch-action:none}

.workbench.workflow .keep-items-master{margin-left:auto;min-height:26px;padding:3px 10px;border-color:#34d399;color:#34d399;white-space:nowrap}
.workbench.workflow .keep-items-master[aria-pressed="true"]{border-color:#f87171;color:#f87171;background:rgba(248,113,113,.08)}

/* Sparse grid slots: empty cells remain real destinations, including the quick item dock. */
.workbench.workflow.icon-only .icon-grid-cell{display:block;width:var(--operator-icon-size,44px);height:var(--operator-icon-size,44px);min-height:var(--operator-icon-size,44px);box-sizing:border-box;border:1px solid transparent;border-radius:9px;background:transparent;pointer-events:auto}
.workbench.workflow.icon-only .icon-grid-cell.is-filtered-cell{opacity:.25}
.workbench.workflow.icon-only .is-grid-target{box-shadow:inset 0 0 0 2px var(--v-list)}
.workbench.workflow.icon-only #keep-item-icons .icon-tile{cursor:grab;touch-action:none}
.workbench.workflow.icon-only #keep-item-icons .icon-tile:not(.is-drag-ghost){will-change:transform}
.workbench.workflow.icon-only .icon-drop-placeholder{border-width:2px;background:color-mix(in srgb,var(--v-list) 20%,transparent)}

/* Idle: invisible internal holes, no spare tail. Actual dragging reveals drop cells only. */
.workbench.workflow.icon-only .icon-grid-cell.is-grid-reserve{display:none}
.workbench.workflow.icon-only.is-icon-grid-dragging .icon-grid-cell{border:1px dashed color-mix(in srgb,var(--v-line-2) 65%,transparent);background:color-mix(in srgb,var(--v-list) 3%,transparent)}
.workbench.workflow.icon-only.is-icon-grid-dragging .is-grid-active>.icon-grid-cell.is-grid-reserve{display:block}

.workbench.workflow{
  --v-bg:#120e13;--v-surface:#1a1219;--v-raised:rgba(35,23,31,.88);--v-raised-2:#38232e;--v-sunken:rgba(15,11,17,.74);
  --v-line:rgba(226,190,195,.13);--v-line-2:rgba(225,185,194,.24);--v-line-3:rgba(235,193,200,.4);
  --v-text:#f5eae5;--v-sub:#c9b7bc;--v-faint:#ad949e;
  --v-accent:#e2a0a8;--v-accent-2:#cd798c;--v-accent-ink:#25101b;
  --v-keep:#e5c39d;--v-keep-2:#d7a080;--v-keep-ink:#281b12;
  --v-danger:#f592a2;--v-warn:#edc88c;
  --v-list:var(--v-accent);--v-list-2:var(--v-accent-2);--v-list-ink:var(--v-accent-ink);
  --v-radius:10px;--v-radius-sm:7px;--v-shadow:0 5px 18px #09050b48;
  --ink:var(--v-text);--muted:var(--v-sub);--mint:var(--v-accent);
  background-color:#160e16;
  background-image:linear-gradient(180deg,rgba(17,11,18,.93) 0%,rgba(25,13,23,.69) 24%,rgba(25,13,23,.44) 47%,rgba(17,11,18,.85) 80%,#110c13 100%),var(--tlipoca-art);
  background-size:cover,auto 100%;background-position:center,61% center;background-repeat:no-repeat;
  border-right:1px solid #ac64764d;box-shadow:12px 0 44px #06030880;
}
.workbench.workflow[data-active=keep]{--v-list:var(--v-keep);--v-list-2:var(--v-keep-2);--v-list-ink:var(--v-keep-ink)}
.workbench.workflow ::selection{background:#ce819756;color:#fff4ed}
.workbench.workflow *{scrollbar-color:#ad738169 transparent}
.workbench.workflow .top-accent{height:2px;background:linear-gradient(90deg,#842f50,#eda5b0 42%,#b35871 72%,transparent)}
.workbench.workflow .brand{height:74px;padding:13px 15px;gap:11px;flex-shrink:0;background:linear-gradient(105deg,#150c15c9,#3213204d);border-bottom:1px solid #db98a016}
.workbench.workflow .brand-avatar{content:var(--tlipoca-avatar);width:43px;height:43px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #21121d,0 0 0 3px #b575835c,0 3px 14px #07030a55}
.workbench.workflow .brand-text strong{font-size:15px;letter-spacing:.07em;font-weight:650;color:#f5e8e1}
.workbench.workflow .brand-text small{font-size:10px;letter-spacing:.18em;color:#ca929f;margin-top:5px}
.workbench.workflow .header-controls{gap:1px}
.workbench.workflow .icon-button{border-radius:7px;color:#bda5ae}
.workbench.workflow .icon-button:hover{background:#59304366;border-color:#e8a4b528;color:#ffebe6}
.workbench.workflow .context{margin:0 14px;min-height:29px;background:#160e1878;border-color:#df99b018;border-radius:0 0 7px 7px;font-size:10px}
.workbench.workflow .phase-pill{background:#cc76971a;color:#e5b6c0;letter-spacing:0}
.workbench.workflow .main{padding:12px 14px 0;gap:9px}
.workbench.workflow .tabs{padding:3px;border-color:#db98a02c;background:#170f19a3;border-radius:9px;min-height:43px;gap:3px}
.workbench.workflow .tab{min-height:35px;font-size:12px;border-radius:6px;letter-spacing:.03em}
.workbench.workflow .tab[aria-selected=true]{color:#fce7e9;background:linear-gradient(130deg,#743647cc,#472735d9);box-shadow:inset 0 1px #f4cbd32b,0 2px 8px #0a060d2b}
.workbench.workflow .tab[aria-selected=true] .tab-counter{background:#f0d1d825;color:#f1c2cc}
.workbench.workflow .tab[aria-selected=true] svg{color:#efb5c0}
.workbench.workflow[data-active=keep] .tab[aria-selected=true]{background:linear-gradient(125deg,#6d4c38d9,#443027d9);color:#f7e3ce}
.workbench.workflow[data-active=keep] .tab[aria-selected=true] svg{color:#edc9a1}
.workbench.workflow .tab-counter{font-size:9px;min-width:19px;background:#dfbfd313;color:#c8aeba}
.workbench.workflow .primary-add,.workbench.workflow .tool-button,.workbench.workflow .search{min-height:37px;border-radius:7px}
.workbench.workflow .primary-add{font-size:12px;font-weight:650;background:linear-gradient(125deg,#e9b7bf,#ce8e9e);box-shadow:0 4px 12px #210c1440;border:1px solid #f9d6da42}
.workbench.workflow[data-active=keep] .primary-add{background:linear-gradient(125deg,#edd3b4,#d5b18d)}
.workbench.workflow .primary-add:hover{filter:brightness(1.06)}
.workbench.workflow .tool-button{background:#211720b3;border-color:#d5a2b329;box-shadow:inset 0 1px #f6dee509;font-size:11px}
.workbench.workflow .tool-button:hover{background:#492735b3;border-color:#dda8b64d}
.workbench.workflow .search{height:37px;background:#140f18a6;border-color:#db98a025}
.workbench.workflow .search input{font-size:12px}
.workbench.workflow .search input::placeholder{color:#aa909e}
.workbench.workflow .search:focus-within{box-shadow:0 0 0 2px #e9a5bc16;border-color:#d898aa7a}
.workbench.workflow .list-heading{padding:2px 1px;color:#e2c6cd;font-size:11px}
.workbench.workflow #enabled-summary,.workbench.workflow #item-enabled-summary{color:#bea2ae;font-size:10px}
.workbench.workflow .operator-row,.workbench.workflow .item-row{background:#21141dc9;border-color:#dc9cae24;box-shadow:0 2px 8px #07030b25;border-radius:8px}
.workbench.workflow .operator-row:hover,.workbench.workflow .item-row:hover{background:#35212bd9;border-color:#dc9cae40}
.workbench.workflow .operator-name strong{color:#eee1dd;font-weight:600}
.workbench.workflow .operator-bonds{color:#bca4ae}
.workbench.workflow .keep-rules{background:#180f18bf;border-color:#dfacbd21;border-radius:0 0 7px 7px}
.workbench.workflow .item-funds-label input,.workbench.workflow .item-limit-label input,.workbench.workflow .keep-rules input{background:#130f16c9;color:#f3e6e3;border-color:#ba869c45;border-radius:5px}
.workbench.workflow .item-stepper button{background:#38232edb;border-color:#cc8fa23b;color:#ebc5cf}
.workbench.workflow .item-help{background:#1a121b99;border-color:#dba1b326;color:#c6afb9}
.workbench.workflow .item-help summary{color:#dcbac7}
.workbench.workflow .list-note{color:#bea5b1;font-size:10px;line-height:1.5}
.workbench.workflow .footer{background:linear-gradient(180deg,#180e1bd9,#120d15f5);border-top:1px solid #ce8ea82b;padding-top:11px}
.workbench.workflow .footer-top{font-size:10px;color:#cebbc3}
.workbench.workflow .auto-card{background:linear-gradient(115deg,#44212d91,#251922c9);border:1px solid #ca849d3d;box-shadow:inset 0 1px #f6d0de0a,0 3px 16px #08030c33;border-radius:9px}
.workbench.workflow .auto-title strong{font-size:12px;color:#f4dfe4;letter-spacing:.04em}
.workbench.workflow .auto-title>svg{color:#e1a3b5}
.workbench.workflow .run-button{background:linear-gradient(135deg,#efbcc7,#d995a7);color:#31111e;border:1px solid #f6d0da4d;box-shadow:0 3px 11px #16081155;border-radius:7px;min-height:33px;font-size:12px}
.workbench.workflow .run-button[aria-checked=true]{background:#351820;color:#ffc3ce;border-color:#f08da875;box-shadow:0 0 0 2px #e99bad12}
.workbench.workflow #draft-note{font-size:11px;line-height:1.65;color:#ddc1cc}
.workbench.workflow .auto-risk{font-size:9px;color:#bca3ae}
.workbench.workflow .utility-bar{border-color:#b98aa125}
.workbench.workflow .utility-button{color:#c0a8b6;font-size:10px}
.workbench.workflow .utility-button:hover{color:#f2c1d0;background:#9f4f701a}
.workbench.workflow .save-status{color:#a98e9f;font-size:9px}
.workbench.workflow .action-menu,.workbench.workflow .advanced-filter,.workbench.workflow .entry-popover{background:#211722fa;border-color:#b8809a4a;box-shadow:0 15px 45px #09040db3}
.workbench.workflow .settings-backdrop,.workbench.workflow .picker-backdrop,.workbench.workflow .utility-backdrop{background:#100911b8;backdrop-filter:blur(8px)}
.workbench.workflow .settings,.workbench.workflow .picker,.workbench.workflow .utility-sheet{background:linear-gradient(150deg,#2a1927,#19111cfb);border-color:#d79ab245;box-shadow:0 18px 70px #07020bbf;border-radius:12px}
.workbench.workflow .settings-head,.workbench.workflow .picker-head,.workbench.workflow .utility-head{border-bottom:1px solid #d49ab21f;background:#3c20301f}
.workbench.workflow .settings h2,.workbench.workflow .picker h2,.workbench.workflow .utility-head h2{color:#f0dbe0;letter-spacing:.04em;font-size:15px;font-weight:600}
.workbench.workflow .settings-note{background:#d2a26f0b;border-color:#d7ae8730;color:#d4bfac;line-height:1.9;font-size:10px}
.workbench.workflow .settings-group p{color:#c0a5b4;line-height:1.7}
.workbench.workflow .picker-list{background:#110c14a1;border-color:#c48fa72e}
.workbench.workflow .picker-add:not(:disabled):hover{background:#72394d33}
.workbench.workflow .picker-footer,.workbench.workflow .utility-foot{border-color:#d0a1b324;background:#160f19b3}
.workbench.workflow .settings-done{background:linear-gradient(120deg,#e2b4c0,#c98c9f);color:#30101e;border-radius:7px}
.workbench.workflow .config-hint,.workbench.workflow .sheet-hint{font-size:10px;color:#b99dad}
.workbench.workflow .toast{background:#2b1925f5;color:#f4dce6;border-color:#d59ab947;box-shadow:0 5px 16px #09030d40}
/* Tile outlines remain green / red / amber. No idle grid, new cells, order or scroll behavior. */
.workbench.workflow.icon-only .icon-tile{box-shadow:0 3px 8px #1009125c;border-radius:9px}
.workbench.workflow.icon-only .operator-avatar{background:#201622}
.workbench.workflow.icon-only .icon-tile:focus-visible{outline-color:#f6d1de}
.preview .preview-stage{background-color:#170e17;background-image:linear-gradient(90deg,#1a0e1b40,transparent 55%),var(--tlipoca-art);background-size:cover;background-position:center;isolation:isolate}
.preview .preview-stage:before{display:none}
.preview .preview-bar{border-color:#e7b2c32b;background:#130c159c;backdrop-filter:blur(12px)}
.preview .preview-bar strong{color:#efd8e2;font-size:11px;font-weight:500}
.preview .preview-bar>span{color:#e6bccd;border-color:#deb2c732}
.preview .preview-bar img{content:var(--tlipoca-avatar);border-radius:50%}
.preview .preview-foot{margin-top:auto;background:#150a17a6;border-color:#f3b3cb24;color:#e4c4d3;font-family:inherit;letter-spacing:.03em;font-size:10px}
@media(max-height:700px){.workbench.workflow .brand{height:60px;padding-top:9px;padding-bottom:9px}.workbench.workflow .brand-avatar{width:36px;height:36px}.workbench.workflow .main{gap:7px;padding-top:9px}.workbench.workflow .context{min-height:26px}}

/* Native, local-only micro-interactions. References: shadcn/ui + Animate UI. */
.workbench.workflow{--motion-fast:140ms;--motion-normal:200ms;--motion-ease:cubic-bezier(.2,.8,.3,1)}
.workbench.workflow .brand{background-image:linear-gradient(110deg,#291321a1,#170f186b);border-bottom-color:#e6b5c41c}
.workbench.workflow .brand .header-controls{gap:0}.workbench.workflow .brand .icon-button{width:27px;height:29px}.workbench.workflow .brand-text strong{font-size:14px;letter-spacing:.04em}
.workbench.workflow .brand-text small{letter-spacing:.1em}
.workbench.workflow :is(.primary-add,.tool-button,.icon-button,.new-button,.run-button,.tab,.density-toggle,.utility-button){transition:background-color var(--motion-fast),border-color var(--motion-fast),color var(--motion-fast),box-shadow var(--motion-fast),scale var(--motion-fast) var(--motion-ease)}
.workbench.workflow :is(.primary-add,.run-button):not(:disabled):hover{box-shadow:0 4px 16px #cd819739,inset 0 1px #ffe4ec30}
.workbench.workflow :is(.primary-add,.run-button,.tool-button):not(:disabled):active{scale:.975}
.workbench.workflow .tab{position:relative;border:1px solid transparent}
.workbench.workflow .tab[aria-selected=true]{border-color:#f7ccdf28;box-shadow:inset 0 1px #f7d8e51f,0 3px 9px #0b060e40}
.workbench.workflow .switch{transition:background-color var(--motion-normal),border-color var(--motion-normal)}
.workbench.workflow .switch>span{transition:transform var(--motion-normal) var(--motion-ease),background-color var(--motion-normal)}
.workbench.workflow :is(.settings,.picker,.utility-sheet){animation:workbench-sheet-in 200ms var(--motion-ease)}
.workbench.workflow :is(.advanced-filter,.action-menu):not([hidden]){animation:workbench-pop-in 150ms var(--motion-ease)}
.workbench.workflow .toast:not([hidden]){animation:workbench-feedback-in 150ms var(--motion-ease)}
.workbench.workflow :is(.operator-row,.item-row){transition:background-color var(--motion-fast),border-color var(--motion-fast),box-shadow var(--motion-fast)}
.workbench.workflow.icon-only .icon-tile:not(.is-drag-ghost){transition:border-color var(--motion-fast),box-shadow var(--motion-fast)}
.workbench.workflow:not(.is-icon-grid-dragging) .icon-tile:not(.is-drag-ghost):hover{box-shadow:0 0 0 2px #f5d0e013,0 5px 14px #12081555}
.workbench.workflow .auto-card{box-shadow:inset 0 1px #f4c4d817,0 3px 14px #10061233}
.workbench.workflow .auto-card:has(.run-button[aria-checked=true]){border-color:#b6d8bc55;background:linear-gradient(115deg,#23382a8c,#211b23dc)}
.workbench.workflow .save-status .save-dot{transition:background-color var(--motion-normal),box-shadow var(--motion-normal)}
.workbench.workflow .settings-group{border-color:#d3a5bb1c}.workbench.workflow .utility-bar{border-color:#d3a5bb21}
@keyframes workbench-sheet-in{from{opacity:0;translate:0 9px}to{opacity:1;translate:0 0}}
@keyframes workbench-pop-in{from{opacity:0;translate:0 4px}to{opacity:1;translate:0 0}}
@keyframes workbench-feedback-in{from{opacity:0;translate:0 3px}to{opacity:1;translate:0 0}}
@media(prefers-reduced-motion:reduce){.workbench.workflow,.workbench.workflow *,.workbench.workflow :before,.workbench.workflow :after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

    },
    clear,
    destroy() { clear(); disposed = true; },

}

function createQuickDock(options) {
  // Two independent windows, one canonical controller. Serialize only layout writes.
  const {storage=null}=options;
  const loaded=Promise.resolve().then(()=>storage?.get()).catch(()=>null).then(saved=>{
    if(saved?.version===2 && saved.windows && typeof saved.windows==='object')return {version:2,windows:{...saved.windows}};
    // Preserve the old combined dock position for auto; items gets its own defaults.
    const win=options.parent.ownerDocument.defaultView;
    const items={visible:saved?.visible===true,collapsed:false};
    if(Number.isFinite(saved?.x)){items.x=saved.x>=300?saved.x-292:Math.max(8,Math.min(win.innerWidth-284,saved.x+292));}
    if(Number.isFinite(saved?.y))items.y=saved.y+(win.innerWidth<600?230:0);
    return {version:2,windows:{auto:saved && typeof saved==='object'?saved:null,items}};
  });
  loaded.catch(()=>{});
  let writes=Promise.resolve();
  const scoped=kind=>({get:()=>loaded.then(value=>value.windows[kind]),set(value){
    const next=writes.catch(()=>{}).then(async()=>{const saved=await loaded;const windows={...saved.windows,[kind]:{...value}};
      await storage?.set({version:2,windows});saved.windows=windows;});writes=next;return next;
  }});
  const auto=createQuickWindow({...options,kind:'auto',storage:scoped('auto')});
  const items=createQuickWindow({...options,kind:'items',storage:scoped('items')});
  const each=(kind,action)=>{if(kind==='auto')auto[action]();else if(kind==='items')items[action]();else{auto[action]();items[action]();}};
  return {update(value){auto.update(value);items.update(value);},show(kind){each(kind,'show');},hide(kind){each(kind,'hide');},destroy(){auto.destroy();items.destroy();}};
}

const launcher = document.querySelector('.launcher');
const collapse = () => { document.body.classList.add('is-collapsed'); launcher.hidden = false; };
launcher.addEventListener('click', () => { document.body.classList.remove('is-collapsed'); launcher.hidden = true; });
let previewDock=null;
const previewKey = 'wei.workbench.preview.v1';
window.weiWorkbench = await mountWorkbench(document.querySelector('#app'), {
  catalogue, brandUrl, version: "0.3.0", preview: true, serverLabel: '卫戍协议 · 静态名单快照',
  storage: { async get() { return JSON.parse(localStorage.getItem(previewKey) || 'null'); }, async set(value) { localStorage.setItem(previewKey, JSON.stringify(value)); },
    async getBackup() { return JSON.parse(localStorage.getItem(previewKey + '.backup') || 'null'); }, async setBackup(value) { localStorage.setItem(previewKey + '.backup', JSON.stringify(value)); } },
  onPlanChange:()=>{if(previewDock)syncQuickPreview();},onQuickOpen:kind=>previewDock?.show(kind),onCollapse: collapse, onClose: collapse,
  onResize(width) { document.documentElement.style.setProperty('--dock-width', width + 'px'); },
});
const syncQuickPreview=()=>{const plan=window.weiWorkbench.getPlan();previewDock?.update({uiReady:true,ready:true,eligible:true,paused:plan.itemBuyingPaused,running:previewRunning,
  items:plan.items.map(item=>({id:item.id,name:Model.ITEMS.find(rec=>rec.id===item.id)?.name || item.name || item.id,enabled:item.enabled,status:item.capPaused?'full':item.enabled?'enabled':'disabled'}))});};
let previewRunning=false;
previewDock=createQuickDock({parent:document.body,onOpenPanel:()=>{document.body.classList.remove('is-collapsed');launcher.hidden=true;},
  onAction:async(command,id)=>{if(command==='auto'){previewRunning=!previewRunning;syncQuickPreview();return {message:'仅预览，不发送游戏操作'};}
    const result=await window.weiWorkbench.quickAction(command,id);syncQuickPreview();return result;},
  storage:{async get(){return null;},async set(){}}});
syncQuickPreview();
</script></body></html>
